<div class="flex flex-row gap-2">
  <div class="relative">
    <button
      [disabled]="!currentLabel()"
      (click)="toogleToFix()"
      class="relative h-full overflow-hidden rounded bg-gray-900 text-cyan-400 text-[11px] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed font-medium"
    >
      @if (isMarkedFixable()) {
        <span class="absolute left-1/2 top-1/2 z-0 block aspect-square w-[200%] -translate-x-1/2 -translate-y-1/2 animate-[spin_2s_linear_infinite] bg-[conic-gradient(transparent_70%,#06b6d4_100%)]"></span>
        <span class="absolute inset-px z-0 rounded bg-gray-900 shadow-[inset_0_3px_8px_rgba(0,0,0,0.8)]"></span>
      }

      <span class="relative z-10 flex h-full items-center justify-center py-4 px-4">
        Needs fix
      </span>
    </button>

    @if (itemCountMarkedAsToFix() > 0) {
      <span
        class="absolute -right-2 -top-2 z-20 flex h-5 min-w-5 items-center justify-center rounded-full bg-cyan-500 px-1 text-[10px] font-bold text-gray-900 shadow-[0_0_8px_rgba(6,182,212,0.6)]"
      >
        {{ itemCountMarkedAsToFix() }}
      </span>
    }
  </div>
  <button
        [disabled]="!isExportable()"
        (click)="export()"
        class="m-2 flex flex-row gap-2 items-center justify-center bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 disabled:cursor-not-allowed text-black px-4 rounded text-[11px] shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all"
      >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
    </svg>
    Export
  </button>
</div>
